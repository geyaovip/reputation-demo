const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DEMO_NOW=new Date();
const FIXED_TODAY=new Date(DEMO_NOW);FIXED_TODAY.setHours(23,59,0,0);
const dateAgo=days=>{const d=new Date(FIXED_TODAY);d.setDate(d.getDate()-days);return d};
const dateISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const dateCN=d=>d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
const dateTimeAgo=(days,time)=>dateISO(dateAgo(days))+' '+time;
const demoTime=()=>String(DEMO_NOW.getHours()).padStart(2,'0')+':'+String(DEMO_NOW.getMinutes()).padStart(2,'0');
const expiryDate=()=>{const d=new Date(DEMO_NOW);d.setDate(d.getDate()+120);return dateISO(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>'<i data-lucide="'+name+'" class="'+cls+'"></i>';
const ISSUE_TAXONOMY=[
  {id:'food-safety',name:'食品安全',description:"菜品异物、变质或用餐后身体不适等食品安全反馈。",version:1},
  {id:'dish',name:'菜品质量',description:"口味、温度、新鲜度和出品稳定性等菜品问题。",version:1},
  {id:'service',name:'服务体验',description:"服务态度、回应及时性和沟通体验等问题。",version:1},
  {id:'speed',name:'出餐效率',description:"下单后出餐、上菜延迟或漏单等问题，不包含排队等位。",version:1},
  {id:'queue',name:'排队等位',description:"入座前排队时长、叫号提醒和等位安排等问题。",version:1},
  {id:'hygiene',name:'环境卫生',description:"就餐环境、餐具、桌面和设施的清洁卫生问题。",version:1},
  {id:'value',name:'价格分量',description:"价格说明、收费、分量和性价比等问题。",version:1}
];
// Classification reads saved analysis results, not editable keywords.
// System-owned reference standards, never editable through merchant settings.
const SYSTEM_RISK_STANDARD_VERSION='risk-v1';
const RISK_STANDARDS=Object.freeze([
  {"id":"food","name":"食品安全","condition":"顾客明确反馈本次用餐菜品存在异物、变质或疑似食物中毒；否定、无关引用及单纯口味偏好不成立。","level":"high"},
  {"id":"injury","name":"人身伤害","condition":"顾客描述本次到店发生烫伤、摔倒、划伤、推搡等人身伤害或安全威胁；泛泛提醒注意安全不成立。","level":"high"},
  {"id":"allergy","name":"过敏","condition":"顾客描述本次用餐后出现疑似过敏反应，或已告知过敏信息但门店未处理；仅询问配料不成立。","level":"high"},
  {"id":"dispute","name":"消费纠纷","condition":"顾客明确提出收费与约定不符、未经告知加收费用、强制消费或退款纠纷；一般价格偏好不成立。","level":"attention"},
  {"id":"conflict","name":"服务冲突","condition":"顾客描述本次服务中发生辱骂、威胁、激烈争执等冲突；普通服务建议不成立。","level":"attention"},
  {"id":"report","name":"投诉举报","condition":"顾客明确表示已就本次消费向监管机构投诉举报，或准备采取该行动；普通改进建议不成立。","level":"high"},
  {"id":"media","name":"媒体曝光","condition":"顾客明确表示本次消费问题已被媒体报道，或正在公开曝光并传播；无关媒体引用不成立。","level":"high"},
  {"id":"malicious","name":"疑似恶意评价","condition":"评价明确包含以差评换返款、优惠或删评收费等要挟；不能仅因低评分或无法查到订单认定恶意。","level":"attention"},

function requestReplyDraft(input,variant,provider=mockReplyProvider){

function reportWeekLabel(date){
  const thursday=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  thursday.setUTCDate(thursday.getUTCDate()+3-(thursday.getUTCDay()+6)%7);
  const year=thursday.getUTCFullYear(),yearStart=Date.UTC(year,0,1);
  const week=Math.ceil(((thursday.getTime()-yearStart)/86400000+1)/7);
  return year+'年第'+week+'周';
}
function closedReportPeriods(type,now=DEMO_NOW){
  const today=new Date(now);today.setHours(0,0,0,0);
  const ordinal=date=>Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000;
  const weekStart=new Date(today);weekStart.setDate(weekStart.getDate()-(today.getDay()+6)%7);
  return Array.from({length:type==='daily'?3:2},(_,i)=>{
    let start,endExclusive;
    if(type==='daily'){start=new Date(today);start.setDate(start.getDate()-i-1);endExclusive=new Date(start);endExclusive.setDate(endExclusive.getDate()+1)}
    else if(type==='weekly'){endExclusive=new Date(weekStart);endExclusive.setDate(endExclusive.getDate()-i*7);start=new Date(endExclusive);start.setDate(start.getDate()-7)}
    else{start=new Date(today.getFullYear(),today.getMonth()-i-1,1);endExclusive=new Date(today.getFullYear(),today.getMonth()-i,1)}
    const end=new Date(endExclusive);end.setDate(end.getDate()-1);
    const range=type==='daily'?dateCN(start):dateCN(start)+'—'+dateCN(end);
    const name=type==='daily'?range+'口碑运营日报':type==='weekly'?reportWeekLabel(start)+'口碑周报':start.getFullYear()+'年'+(start.getMonth()+1)+'月口碑经营月报';
    return {name,range,startDate:dateISO(start),endDate:dateISO(end),from:ordinal(today)-ordinal(end),to:ordinal(today)-ordinal(start)+1,status:i===0?'已生成':'已归档',generatedAt:dateCN(endExclusive)+' 00:05'};
  });
}

function reportTrendRows(selected){
  if(selected.id.startsWith('daily-')){
    return Array.from({length:24},(_,hour)=>{
      const list=selected.list.filter(r=>r.time&&Number(String(r.time).split(':')[0])===hour),label=String(hour).padStart(2,'0')+':00';
      return {hoverLabel:selected.startDate+' '+label,label,total:list.length,bad:list.filter(r=>r.rating<=3).length};
    });
  }
  const [year,month,day]=selected.startDate.split('-').map(Number);
  return Array.from({length:selected.to-selected.from},(_,i)=>{
    const date=new Date(year,month-1,day+i),daysAgo=selected.to-1-i,list=selected.list.filter(r=>r.daysAgo===daysAgo);
    return {date:dateISO(date),label:(date.getMonth()+1)+'/'+date.getDate(),total:list.length,bad:list.filter(r=>r.rating<=3).length};
  });
}

function readMemberScope(roleSelector,scopeSelector){

function replySettingsDraft(){

  return app.replySettingsDraft;
}
function replySettingsDirty(){const draft=replySettingsDraft();return REPLY_SETTING_KEYS.some(key=>key==='blocked'?JSON.stringify(replyBlockedWords(draft.blocked))!==JSON.stringify(replyBlockedWords()):draft[key]!==app.settings[key])}
function startBlockedWordEdit(index=null){const words=replyBlockedWords(replySettingsDraft().blocked);app.replyBlockedEditor={index,value:index===null?'':words[index],error:''}}
function commitBlockedWord(){
  const editor=app.replyBlockedEditor;if(!editor)return '';
  const value=editor.value.trim(),words=replyBlockedWords(replySettingsDraft().blocked);
  if(!value)return editor.error='请输入禁用词句';
  if(words.some((word,index)=>index!==editor.index&&word===value))return editor.error='该词句已存在';
  if(editor.index===null)words.push(value);else words[editor.index]=value;
  replySettingsDraft().blocked=words;app.replyBlockedEditor=null;return '';
}
function removeBlockedWord(index){const words=replyBlockedWords(replySettingsDraft().blocked);words.splice(index,1);replySettingsDraft().blocked=words}

const AI_SHORTCUTS=[
  ['今日待办','查看今天需要处理的评价和风险','overview','list-checks'],
  ['起草回复','选择待回复差评并生成草稿','reply_select','message-square-reply'],
  ['风险待办','查看尚未办结的高风险评价','risk','shield-alert'],
  ['差评趋势','比较近7天与前7天的差评','bad_trend','chart-no-axes-combined']
];
const AI_QUESTIONS=[
  ['近30天哪家门店差评最多？','门店对比','compare','store'],
  ['差评主要集中在哪些问题？','问题标签','issues','tags'],
  ['各平台差评表现如何？','平台对比','platform','chart-no-axes-combined']
];
const AI_PROMPTS=[...AI_SHORTCUTS,...AI_QUESTIONS];
function aiScenarioFor(text){
  if(/回复|草稿|措辞/.test(text))return /等餐|出餐|上菜|等待/.test(text)?'reply_select_speed':'reply_select';
  if(/差评.*(趋势|变化|增加|下降)|差评最近/.test(text))return 'bad_trend';
  if(/报告|总结|本月|月报|周报|本周|日报/.test(text))return 'report';
  if(/连接|同步|授权|完整|缺口/.test(text))return 'connection';
  if(/今天|优先|待办/.test(text))return 'overview';
  if(/平台|渠道/.test(text)&&/对比|评价|差评|表现/.test(text))return 'platform';
  if(/高风险|食品安全|异物/.test(text))return 'risk';
  if(/出餐|上菜|等餐/.test(text))return 'issue';
  if(/问题|原因|标签|分类|集中|高频/.test(text))return 'issues';
  if(/哪家|对比|最多|排名|门店表现|差评.*多少|多少.*差评/.test(text))return 'compare';
  if(/风险|处理/.test(text))return 'overview';
  return 'unknown';
}
function aiMetric(label,value){return '<div class="ai-metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong></div>'}
function aiEvidence(rows){return rows.length?'<div class="ai-evidence"><strong>关联评价</strong>'+rows.map(r=>'<button data-ai-open-review="'+r.id+'" aria-label="查看评价 '+esc(r.id.toUpperCase())+'"><span><b>'+esc(storeBy(r.storeId)?.name)+' · '+esc(platformBy(r.platformId)?.short)+' · '+r.rating+'星</b><small>'+esc(r.id.toUpperCase())+' · '+esc(r.text)+'</small></span>'+icon('arrow-up-right')+'</button>').join('')+'</div>':''}
function aiActions(items){return '<div class="ai-answer-actions">'+items.map(x=>'<button class="'+(x.primary?'btn':'btn-outline')+'" '+x.attr+'>'+icon(x.icon||'arrow-up-right')+esc(x.label)+'</button>').join('')+'</div>'}

function aiQueryContext(prompt){

function aiScopedRows(context={}){return app.reviews.filter(r=>(!context.storeId||context.storeId==='all'||r.storeId===context.storeId)&&(!context.platformId||context.platformId==='all'||r.platformId===context.platformId))}

const aiLauncherButton=$('#aiLauncher');
const aiLauncherState={x:null,y:null,dock:null,revealed:false,drag:null,suppressClickUntil:0,viewportWidth:window.innerWidth,viewportHeight:window.innerHeight};
const clampLauncher=(value,min,max)=>Math.min(Math.max(value,min),Math.max(min,max));
function placeAiLauncher(){
  const size=aiLauncherButton.offsetWidth||56,vw=window.innerWidth,vh=window.innerHeight;
  if(aiLauncherState.x===null)aiLauncherState.x=vw-size-16;
  if(aiLauncherState.y===null)aiLauncherState.y=vh-size-18;
  aiLauncherState.y=clampLauncher(aiLauncherState.y,8,vh-size-8);
  if(!aiLauncherState.dock)aiLauncherState.x=clampLauncher(aiLauncherState.x,8,vw-size-8);

  aiLauncherButton.style.top=Math.round(aiLauncherState.y)+'px';
  aiLauncherButton.classList.toggle('is-docked',!!aiLauncherState.dock);
  aiLauncherButton.classList.toggle('is-revealed',aiLauncherState.revealed);

function saveAiLauncherPosition(){

}
function finishAiLauncherDrag(){

  aiLauncherState.drag=null;aiLauncherButton.classList.remove('is-dragging');
  if(!drag.moved)return;
  const size=aiLauncherButton.offsetWidth||56,center=aiLauncherState.x+size/2,vw=window.innerWidth;

function initAiLauncher(){
  try{const saved=JSON.parse(localStorage.getItem('reputationAiLauncherPosition')||'null');if(saved&&Number.isFinite(saved.y)){
    aiLauncherState.x=Number.isFinite(saved.x)?saved.x*window.innerWidth/(saved.vw||window.innerWidth):null;
    aiLauncherState.y=saved.y*window.innerHeight/(saved.vh||window.innerHeight);
    aiLauncherState.dock=saved.dock==='left'||saved.dock==='right'?saved.dock:null;
  }}catch(e){}
  placeAiLauncher();
  aiLauncherButton.addEventListener('pointerdown',e=>{
    if(e.button!==0||!e.isPrimary)return;
    const rect=aiLauncherButton.getBoundingClientRect();
    aiLauncherState.drag={startX:e.clientX,startY:e.clientY,offsetX:aiLauncherState.dock?rect.width/2:e.clientX-rect.left,offsetY:e.clientY-rect.top,moved:false};

    if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<7)return;
    if(!drag.moved){drag.moved=true;aiLauncherState.dock=null;aiLauncherState.revealed=false;aiLauncherButton.classList.add('is-dragging')}
    const size=aiLauncherButton.offsetWidth||56;
    aiLauncherState.x=clampLauncher(e.clientX-drag.offsetX,8,window.innerWidth-size-8);
    aiLauncherState.y=clampLauncher(e.clientY-drag.offsetY,8,window.innerHeight-size-8);
    placeAiLauncher();
  });
  aiLauncherButton.addEventListener('pointerup',finishAiLauncherDrag);
  aiLauncherButton.addEventListener('pointercancel',finishAiLauncherDrag);
  aiLauncherButton.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&aiLauncherState.dock&&!aiLauncherState.drag){aiLauncherState.revealed=true;placeAiLauncher()}});
  aiLauncherButton.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&aiLauncherState.dock&&!aiLauncherState.drag&&!aiLauncherButton.matches(':focus-visible')){aiLauncherState.revealed=false;placeAiLauncher()}});

function renderNotifications(){

function replyValidation(r,text){
  if(!r||!isReplyPending(r))return '该评价已回复，请刷新后查看';
  if(!text)return '请先生成或填写回复草稿';
  const c=app.connections[r.storeId]?.find(x=>x.platformId===r.platformId);
  if(c?.status!=='connected'||!platformBy(r.platformId)?.reply)return '当前平台连接不具备回复权限，请先恢复连接';
  const hit=replyBlockedWords().find(phrase=>text.includes(phrase));
  return hit?'回复含禁用词“'+hit+'”，请修改后再提交':'';
}

}
function publishReply(id){
